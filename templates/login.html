<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Defender Login</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* BODY WITH ANIMATED GRADIENT */
body {
    margin: 0;
    height: 100vh;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #0f172a, #111827, #1e293b, #0f172a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #e2e8f0;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* LOGIN CARD */
.card {
    background: linear-gradient(145deg, #1e293b, #111827);
    padding: 50px 30px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 20px rgba(34,197,94,0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 30px rgba(34,197,94,0.5), 0 0 30px rgba(34,197,94,0.6);
}

/* HEADER */
.card h2 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 25px;
    color: #22c55e;
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(34,197,94,0.6);
}

/* INPUT FIELD */
input[type="password"] {
    width: 100%;
    padding: 12px 15px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #1f2937;
    color: #e2e8f0;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
}

input[type="password"]::placeholder {
    color: #94a3b8;
}

input[type="password"]:focus {
    outline: none;
    box-shadow: 0 0 8px #22c55e, inset 0 0 6px rgba(0,0,0,0.5);
}

/* LOGIN BUTTON */
button {
    padding: 12px;
    width: 100%;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 15px;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 10px #22c55e33;
}

button:hover {
    background: #16a34a;
    transform: translateY(-2px);
    box-shadow: 0 0 15px #22c55e55, 0 0 20px #22c55e44 inset;
}

/* RESPONSIVE */
@media (max-width: 400px) {
    .card {
        width: 90%;
        padding: 40px 20px;
    }
    .card h2 {
        font-size: 24px;
    }
    input[type="password"], button {
        font-size: 14px;
    }
}
</style>
</head>
<body>

<div class="card">
    <h2>Campus Defender</h2>
    <form method="POST">
        <input type="password" name="password" placeholder="Enter Admin Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
